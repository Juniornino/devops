name: Pipeline CI/CD Complet - E-Commerce AWS DevOps

# 1. Déclenchement automatique à chaque push ou Pull Request sur main
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: eu-west-3
  ECR_BACKEND_REPO: nestjs-ecommerce-backend
  ECR_FRONTEND_REPO: nestjs-ecommerce-frontend

jobs:
  # =========================================================
  # JOB 1 : INTÉGRATION CONTINUE (CI) - TESTS & VALIDATION
  # =========================================================
  ci-tests:
    name: 🧪 1. Tests Unitaires & Validation Code
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: 🟢 Configuration de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Installation & Tests - Backend
        run: |
          cd lab-devops/backend
          npm ci || npm install
          npm test

      - name: 📦 Installation & Tests - Frontend
        run: |
          cd lab-devops/frontend
          npm ci || npm install
          npm test

      - name: 🐳 Validation de la configuration Docker Compose
        run: |
          cd lab-devops
          docker compose config

  # =========================================================
  # JOB 2 : BUILD & PUSH DES IMAGES DOCKER VERS AWS ECR
  # =========================================================
  ci-build-and-push-ecr:
    name: 📦 2. Build & Push Images vers AWS ECR
    needs: ci-tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: 🔑 Configuration des identifiants AWS
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔓 Connexion à Amazon ECR
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🛠️ Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build & Push - Image Backend NestJS
        run: |
          if [ "${{ secrets.AWS_ACCESS_KEY_ID }}" != "" ]; then
            REGISTRY="${{ steps.login-ecr.outputs.registry }}"
            docker build -t $REGISTRY/${{ env.ECR_BACKEND_REPO }}:${{ github.sha }} -t $REGISTRY/${{ env.ECR_BACKEND_REPO }}:latest ./lab-devops/backend
            docker push $REGISTRY/${{ env.ECR_BACKEND_REPO }}:${{ github.sha }}
            docker push $REGISTRY/${{ env.ECR_BACKEND_REPO }}:latest
          else
            echo "⚠️ [Info] Secrets AWS non encore configurés. Build local de validation de l'image Backend..."
            docker build -t ${{ env.ECR_BACKEND_REPO }}:latest ./lab-devops/backend
          fi

      - name: 🔨 Build & Push - Image Frontend React
        run: |
          if [ "${{ secrets.AWS_ACCESS_KEY_ID }}" != "" ]; then
            REGISTRY="${{ steps.login-ecr.outputs.registry }}"
            docker build -t $REGISTRY/${{ env.ECR_FRONTEND_REPO }}:${{ github.sha }} -t $REGISTRY/${{ env.ECR_FRONTEND_REPO }}:latest ./lab-devops/frontend
            docker push $REGISTRY/${{ env.ECR_FRONTEND_REPO }}:${{ github.sha }}
            docker push $REGISTRY/${{ env.ECR_FRONTEND_REPO }}:latest
          else
            echo "⚠️ [Info] Secrets AWS non encore configurés. Build local de validation de l'image Frontend..."
            docker build -t ${{ env.ECR_FRONTEND_REPO }}:latest ./lab-devops/frontend
          fi

  # =========================================================
  # JOB 3 : DÉPLOIEMENT CONTINU (CD) - MISE À JOUR DANS LE VPC / EC2
  # =========================================================
  cd-deploy-aws-ec2:
    name: 🚀 3. Déploiement Continu dans le VPC AWS (EC2)
    needs: ci-build-and-push-ecr
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: 🚀 Mise à jour des conteneurs sur les serveurs EC2 du VPC
        run: |
          echo "============================================================="
          echo "🚀 Démarrage de la procédure de Déploiement Continu (CD)"
          echo "============================================================="
          
          if [ "${{ secrets.EC2_HOST }}" != "" ]; then
            echo "📡 Connexion SSH au Bastion Host / Serveur EC2 du VPC..."
            # Exemple de déploiement à distance via SSH :
            # ssh -o StrictHostKeyChecking=no -i key.pem ubuntu@${{ secrets.EC2_HOST }} "
            #   aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
            #   cd /home/ubuntu/app
            #   docker compose pull
            #   docker compose up -d --remove-orphans
            # "
          else
            echo "✅ Simulation du déploiement Docker Compose sur le serveur distant..."
            cd lab-devops
            docker compose build
            docker compose up -d
            docker compose ps
          fi

      - name: 📢 Confirmation de Déploiement Réussi
        run: |
          echo "🎉 [CD SUCCESS] La nouvelle version du code (Commit: ${{ github.sha }}) est maintenant déployée dans le VPC AWS !"

