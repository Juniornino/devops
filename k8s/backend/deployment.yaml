apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: lab-devops
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: node:20-alpine
          workingDir: /app
          ports:
            - containerPort: 3001
          env:
            - name: DATABASE_URL
              value: "postgres://postgres:secretpassword@db-service:5432/lab_ghislain"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
