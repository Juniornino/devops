version: '3.8'

services:
  # Service 1 : Base de données PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: lab_ghislain
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Service 2 : API Backend
  backend:
    build: ./backend
    container_name: backend_api
    restart: always
    ports:
      - "3002:3001"
    environment:
      DATABASE_URL: postgres://postgres:secretpassword@db:5432/lab_ghislain
    depends_on:
      - db

  # Service 3 : Application Frontend
  frontend:
    build: ./frontend
    container_name: frontend_app
    restart: always
    ports:
      - "3003:3000"
    depends_on:
      - backend

  # Service 4 : Nginx Reverse Proxy
  proxy:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "8085:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data: